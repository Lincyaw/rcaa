description: Among runs that queried a true root-cause service, what separates those that submitted it.
where: "probed_gt_service_share > 0"
target: "any_service_hit == 1"
by: [model, case_id]
outcomes: [eval, rc_services, gt_fault_kinds, probed_gt_service_share, dropped_gt_service]
pairs:
  within: case_id
  spread: system
  distinct: model
  n: 5
