description: Among runs that named a true root-cause service of a network fault, what separates those that also named the fault kind.
where: "any_service_hit == 1 and (gt_fault_kinds__network_delay == 1 or gt_fault_kinds__network_loss == 1 or gt_fault_kinds__network_partition == 1 or gt_fault_kinds__network_bandwidth_limit == 1 or gt_fault_kinds__network_corrupt == 1)"
target: "any_root_cause_hit == 1"
by: [model, case_id]
outcomes: [eval, rc_services, gt_fault_kinds, submitted_fault_kinds]
pairs:
  within: case_id
  spread: system
  distinct: model
  n: 5
