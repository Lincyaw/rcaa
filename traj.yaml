# traj-analyzer project for the RCABench evaluation runs; docs/design.md in the traj-analyzer repository describes
# every field.
version: 1

datasets:
  ops-lite:
    adapter: rcabench_eval
    input: [data/eval.db]
    options:
      experiments: [ops-lite]
    description: |
      This trajectory is an LLM agent doing root cause analysis (RCA) of a microservice incident.
      The agent queries telemetry parquet files (abnormal_* for the incident window, normal_* for a baseline window) with DuckDB SQL through query_parquet_files, may record reasoning with think_tool, and ends with submit_findings.
      The step named final_answer is the submitted JSON: root causes (service, fault_kind, evidence items with a claim and SQL) and propagation edges.
      A system step named force_submit means the harness stopped the investigation because the budget ran out.

      The metadata block below names the system: ts = TrainTicket, hs = HotelReservation, otel-demo = OpenTelemetry demo.

      Tool results were cut to about 3000 characters when the run was stored, while the agent saw them whole; a result ending with "[cut when stored]" is incomplete.
      Do not count a claim as unsupported only because its numbers could be in the cut-off part of such a result.

# Enabled operators; `traj operators list` shows the built-in library and the project's operators/ directory.
# LLM operators with the same `call` share one LLM call per trajectory.
operators:
  - use: meta.fields
    as: case
    params:
      fields:
        model: {key: model, type: category}
        case_id: {key: case_index, type: category}
        system: {key: system, type: category}
        rc_services: {key: rc_services, type: set}
        gt_fault_kinds: {key: eval_gt_fault_kinds, type: set}
        gt_fault_families: {key: eval_gt_fault_families, type: set}
  - use: meta.fields
    as: eval
    params:
      fields:
        f1: {key: eval_f1, type: scalar, range: [0, 1], thresholds: {low: 0.34}}
        exact_match: {key: eval_exact_match, type: boolean}
        any_root_cause_hit: {key: eval_any_root_cause_hit, type: boolean}
        any_service_hit: {key: eval_any_service_hit, type: boolean}
        fault_kind_accuracy: {key: eval_fault_kind_accuracy, type: scalar, range: [0, 1]}
        sql_executable_rate: {key: eval_sql_executable_rate, type: scalar, range: [0, 1]}
        path_reachability: {key: eval_path_reachability, type: boolean}
        node_f1: {key: eval_node_f1, type: scalar, range: [0, 1]}
        edge_f1: {key: eval_edge_f1, type: scalar, range: [0, 1]}
        fault_status: {key: eval_fault_status, type: set}
  - use: rca.tool_use
  - use: rca.protocol
  - use: rca.data_coverage
  - use: rca.submission
  - use: rca.final_answer
    call: rca_extract
  - use: rca.stated_suspects
    call: rca_extract
  - use: rca.stated_observations
    call: rca_extract
  - use: meta.fields
    as: cost
    params:
      fields:
        output_tokens: {key: output_tokens, type: scalar}
        input_tokens: {key: input_tokens, type: scalar}
        elapsed_s: {key: elapsed_s, type: scalar}
  - use: rca.gt_coverage

calls:
  rca_extract:
    evidence: true

render:
  max_step_chars: 4000
  chunk_chars: 24000
  # LLM operators read the investigation without knowing the model, the experiment, the ground truth or the evaluation.
  hide_metadata: [exp_id, model, agent, time_cost, input_tokens, output_tokens, cache_hit_tokens, n_llm_calls,
                  prompt_path, elapsed_s, total_steps, rc_services, fault_type, case_source, "eval_*"]

engine:
  dsh_home: ~/.dsh
  model: DeepSeek-V4-flash
  provider: litellm
  reasoning_effort: null
  env_passthrough: [LITELLM_API_KEY, LITELLM_BASE_URL]
  patches: [engine/litellm.patch.yml]

extract:
  workers: 4
  timeout_s: 900
  attempts: 2

sampling:
  vector_length: 10
